<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="면담하고 싶은 직업의 사람과 이야기하고, 면담 요약을 받는 무료 AI 웹 앱" />
    <title>JOB BOT</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="./assets/styles.css?v=named-2" />
  </head>
  <body>
    <div class="paper" aria-hidden="true"></div>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>JOB BOT</span>
        </div>
        <div class="topbar-meta">
          <span class="topbar-job" id="topbar-job" hidden></span>
          <button type="button" class="btn btn-ghost" id="end-btn" hidden>종료</button>
        </div>
      </header>

      <main class="stage" id="app">
        <section class="screen is-active" id="screen-welcome" data-screen="welcome">
          <div class="welcome-copy">
            <h1 class="greeting" id="greeting">면담하고 싶은 직업을 알려 주세요.</h1>
            <form class="job-form" id="job-form" autocomplete="off" action="#" method="post">
              <label for="job-input">면담하고 싶은 직업:</label>
              <input
                id="job-input"
                name="job"
                type="text"
                maxlength="60"
                placeholder="예: 변호사, 요리사, 프로덕트 매니저"
                required
              />
              <button type="submit" class="btn btn-primary">시작하기</button>
            </form>
          </div>
        </section>

        <section class="screen screen-prep" id="screen-preparing" data-screen="preparing" hidden>
          <div class="prep-head">
            <p class="status-kicker" id="prep-kicker">준비 중...</p>
            <h2 class="status-title" id="prep-title">면담을 준비하고 있습니다</h2>
            <p class="load-status" id="load-status"></p>
            <ol class="steps" id="prep-steps" aria-live="polite" hidden>
              <li data-step="prompt">역할 프롬프트 작성</li>
              <li data-step="test">응답 확인</li>
              <li data-step="ui">채팅 준비</li>
            </ol>
          </div>
          <div class="terminal" id="prep-terminal" aria-live="polite" hidden></div>
        </section>

        <section class="screen screen-chat" id="screen-chat" data-screen="chat" hidden>
          <div class="transcript" id="transcript" role="log" aria-live="polite"></div>
          <form class="composer" id="chat-form">
            <label class="sr-only" for="chat-input">메시지</label>
            <textarea
              id="chat-input"
              rows="1"
              maxlength="2000"
              placeholder="편하게 물어보세요"
              required
            ></textarea>
            <button type="submit" class="btn btn-primary" id="send-btn">보내기</button>
          </form>
        </section>

        <section class="screen screen-prep" id="screen-summarizing" data-screen="summarizing" hidden>
          <div class="prep-head">
            <p class="status-kicker">준비 중...</p>
            <h2 class="status-title">면담을 정리하고 있습니다</h2>
            <p class="status-copy">대화의 핵심만 골라 요약할게요.</p>
          </div>
          <div class="terminal" id="summary-terminal" aria-live="polite"></div>
        </section>

        <section class="screen screen-summary" id="screen-summary" data-screen="summary" hidden>
          <div class="summary-scroll">
            <p class="summary-kicker">면담 요약</p>
            <h2 class="summary-job" id="summary-job"></h2>
            <article class="summary-card" id="summary-card"></article>
          </div>
          <button type="button" class="btn btn-primary" id="restart-btn">다시 시작</button>
        </section>
      </main>
    </div>
    <script type="module" src="./assets/app.js?v=named-3"></script>
  </body>
</html>
