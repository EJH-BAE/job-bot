<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="원하는 직업이 되어 대화하고, 면담 요약을 받는 무료 AI 웹 앱" />
    <title>JOB BOT</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="paper" aria-hidden="true"></div>
    <main class="app" id="app">
      <section class="screen is-active" id="screen-welcome" data-screen="welcome">
        <header class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>JOB BOT</span>
        </header>
        <h1 class="greeting" id="greeting"></h1>
        <form class="job-form" id="job-form" autocomplete="off">
          <label for="job-input">원하는 직업:</label>
          <input
            id="job-input"
            name="job"
            type="text"
            maxlength="60"
            placeholder="예: 변호사, 요리사, 프로덕트 매니저"
            required
          />
          <button type="submit" class="btn btn-primary">시작하기</button>
        </form>
      </section>

      <section class="screen" id="screen-preparing" data-screen="preparing" hidden>
        <header class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>JOB BOT</span>
        </header>
        <p class="status-kicker" id="prep-kicker">준비 중...</p>
        <h2 class="status-title" id="prep-title">역할을 만들고 있습니다</h2>
        <p class="status-copy" id="prep-progress"></p>
        <div class="progress-bar" id="prep-bar" hidden><span></span></div>
        <ol class="steps" id="prep-steps" aria-live="polite">
          <li data-step="prompt">역할 프롬프트 작성</li>
          <li data-step="test">응답 확인</li>
          <li data-step="ui">채팅 준비</li>
        </ol>
      </section>

      <section class="screen screen-chat" id="screen-chat" data-screen="chat" hidden>
        <header class="chat-bar">
          <div>
            <p class="chat-kicker">오늘의 직업</p>
            <h2 class="chat-job" id="chat-job"></h2>
          </div>
          <button type="button" class="btn btn-ghost" id="end-btn">종료</button>
        </header>
        <div class="transcript" id="transcript" role="log" aria-live="polite"></div>
        <form class="composer" id="chat-form">
          <label class="sr-only" for="chat-input">메시지</label>
          <textarea
            id="chat-input"
            rows="1"
            maxlength="2000"
            placeholder="질문을 입력하세요"
            required
          ></textarea>
          <button type="submit" class="btn btn-primary" id="send-btn">보내기</button>
        </form>
      </section>

      <section class="screen" id="screen-summarizing" data-screen="summarizing" hidden>
        <header class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>JOB BOT</span>
        </header>
        <p class="status-kicker">준비 중...</p>
        <h2 class="status-title">면담을 정리하고 있습니다</h2>
        <p class="status-copy">대화의 핵심만 골라 요약할게요.</p>
      </section>

      <section class="screen screen-summary" id="screen-summary" data-screen="summary" hidden>
        <header class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>JOB BOT</span>
        </header>
        <p class="summary-kicker">면담 요약</p>
        <h2 class="summary-job" id="summary-job"></h2>
        <article class="summary-card" id="summary-card"></article>
        <button type="button" class="btn btn-primary" id="restart-btn">다시 시작</button>
      </section>
    </main>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
